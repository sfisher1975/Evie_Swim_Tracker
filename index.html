<script>
let BASE=[],EXTRA=JSON.parse(localStorage.getItem('evieSwims')||'[]'),GOALS=JSON.parse(localStorage.getItem('evieGoals')||'{}'),LISTS=JSON.parse(localStorage.getItem('evieLists')||'null')||{courses:['SCY','LCM','SCM'],events:[],places:[]},PROFILE=JSON.parse(localStorage.getItem('evieProfile')||'null')||{name:'Evelyn Fisher',team:'PEAQ',age:12},SYNC=JSON.parse(localStorage.getItem('evieGitHubSync')||'null')||{owner:'',repo:'',branch:'main',path:'data/evie-data.json',token:''},CLOUD_SHA='',syncTimer=null,cloudSavePromise=null;const $=s=>document.querySelector(s),all=()=>[...BASE,...EXTRA];
function fmt(sec){sec=Number(sec);if(sec>=60){let m=Math.floor(sec/60),s=(sec-m*60).toFixed(2).padStart(5,'0');return m+':'+s}return sec.toFixed(2)}function uniq(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y)))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mergeSwims(a,b){let m=new Map();[...(a||[]),...(b||[])].forEach(x=>m.set(x.id||[x.event,x.date,x.course,x.time].join('|'),x));return [...m.values()]}
function applyData(j,merge=true){if(!j)return;EXTRA=merge?mergeSwims(j.swims,EXTRA):(j.swims||[]);GOALS={...(j.goals||{}),...GOALS};if(j.lists){LISTS.courses=uniq([...(j.lists.courses||[]),...(LISTS.courses||[])]);LISTS.events=uniq([...(j.lists.events||[]),...(LISTS.events||[])]);LISTS.places=uniq([...(j.lists.places||[]),...(LISTS.places||[])])}if(j.profile&&!localStorage.getItem('evieProfile'))PROFILE=j.profile;saveLocalOnly()}
function dataPayload(){return {version:3,updated:new Date().toISOString(),swims:EXTRA,goals:GOALS,lists:{courses:LISTS.courses||[],events:LISTS.events||[],places:LISTS.places||[]},profile:PROFILE}}
function saveLocalOnly(){localStorage.setItem('evieSwims',JSON.stringify(EXTRA));localStorage.setItem('evieGoals',JSON.stringify(GOALS));localStorage.setItem('evieLists',JSON.stringify(LISTS));localStorage.setItem('evieProfile',JSON.stringify(PROFILE))}
function syncConfigured(){return !!(SYNC.owner&&SYNC.repo&&SYNC.path&&SYNC.token)}
function apiUrl(){return `https://api.github.com/repos/${encodeURIComponent(SYNC.owner)}/${encodeURIComponent(SYNC.repo)}/contents/${SYNC.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(SYNC.branch||'main')}`}
function decode64(s){let bin=atob(s.replace(/\n/g,'')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function encode64(s){let bytes=new TextEncoder().encode(s),bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
async function cloudLoad(){if(!syncConfigured())return false;let r=await fetch(apiUrl(),{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+SYNC.token,'X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});if(!r.ok)throw new Error('GitHub read failed ('+r.status+')');let x=await r.json();CLOUD_SHA=x.sha;applyData(JSON.parse(decode64(x.content)),true);seedLists();renderAll();updateSyncStatus('Synced');return true}
async function cloudSaveOnce(){if(!syncConfigured())return false;updateSyncStatus('Saving…');for(let attempt=1;attempt<=4;attempt++){let get=await fetch(apiUrl(),{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+SYNC.token,'X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});let sha='';if(get.ok){let x=await get.json();sha=x.sha;CLOUD_SHA=sha;let remote=JSON.parse(decode64(x.content));applyData(remote,true)}else if(get.status!==404)throw new Error('GitHub read failed ('+get.status+')');let body={message:'Update Evie swim data',content:encode64(JSON.stringify(dataPayload(),null,2)),branch:SYNC.branch||'main'};if(sha)body.sha=sha;let r=await fetch(apiUrl().replace(/\?ref=.*$/,''),{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+SYNC.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){let x=await r.json();CLOUD_SHA=x.content?.sha||'';saveLocalOnly();renderAll();updateSyncStatus('Synced');return true}if(r.status===409&&attempt<4){updateSyncStatus('Retrying sync…');await new Promise(res=>setTimeout(res,250*attempt));continue}let detail='';try{let e=await r.json();detail=e.message?' — '+e.message:''}catch{}throw new Error('GitHub save failed ('+r.status+')'+detail)}return false}
async function cloudSave(){if(cloudSavePromise)return cloudSavePromise;cloudSavePromise=cloudSaveOnce();try{return await cloudSavePromise}finally{cloudSavePromise=null}}
function queueSync(){saveLocalOnly();if(!syncConfigured())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudSave().catch(e=>{updateSyncStatus('Sync error');alert(e.message)}),500)}
function updateSyncStatus(t){let e=$('#syncStatus');if(e)e.textContent=t||(syncConfigured()?'GitHub shared data connected':'Set up shared phone + PC data')}
async function boot(){try{let seed=await fetch('data/evie-data.json',{cache:'no-store'}).then(r=>r.json());applyData(seed,true)}catch{} BASE=[];seedLists();renderAll();updateSyncStatus();if(syncConfigured())try{await cloudLoad();await cloudSave()}catch(e){updateSyncStatus('Sync error — tap to fix')}}
function bests(){let m={};all().forEach(s=>{let k=s.event+'|'+s.course;if(!m[k]||s.seconds<m[k].seconds)m[k]=s});return Object.values(m).sort((a,b)=>a.distance-b.distance||a.event.localeCompare(b.event))}
function swimCard(s){let pb=bests().some(x=>x.id===s.id);return `<div class="card ${pb?'pb':''}" onclick="openSwim('${s.id}')"><div class="top"><div><div class="num">${esc(s.event)}</div><div class="name">${esc(s.time||fmt(s.seconds))}</div><div class="meta">${esc(s.date)} · ${esc(s.course)} · ${esc(s.stroke)}</div></div><span class="pill">${pb?'PB':esc(s.stroke)}</span></div>${s.drop?`<div class="drop">↓ ${s.drop.toFixed(2)} sec improvement</div>`:''}</div>`}
function dashboard(){let a=all().slice().sort((x,y)=>y.date.localeCompare(x.date)),b=bests();$('#bestGrid').innerHTML=b.map(s=>`<div class="card pb" onclick="openSwim('${s.id}')"><div class="small">${esc(s.event)}</div><div class="time">${esc(s.time||fmt(s.seconds))}</div><div class="small">${esc(s.course)}</div></div>`).join('')||'<div class="empty">No times yet.</div>';$('#recent').innerHTML=a.slice(0,4).map(swimCard).join('')||'<div class="empty">No swims yet.</div>';renderProfile()}
function filtered(){let q=$('#q').value.toLowerCase(),st=$('#stroke').value,a=all().filter(s=>(!st||s.stroke===st)&&(!q||s.event.toLowerCase().includes(q)||s.stroke.toLowerCase().includes(q)));let sort=$('#sort').value;if(sort==='date')a.sort((x,y)=>y.date.localeCompare(x.date));if(sort==='event')a.sort((x,y)=>x.event.localeCompare(y.event)||y.date.localeCompare(x.date));if(sort==='fast')a.sort((x,y)=>x.seconds-y.seconds);return a}function times(){let a=filtered();$('#count').textContent=a.length+' swims';$('#swimList').innerHTML=a.map(swimCard).join('')||'<p class="small">No swims found.</p>'}
function progress(){let ev=uniq(all().map(s=>s.event)),cur=$('#progressEvent').value;$('#progressEvent').innerHTML=ev.map(e=>`<option ${e===cur?'selected':''}>${esc(e)}</option>`).join('');drawProgress()}
function drawProgress(){let ev=$('#progressEvent').value,a=all().filter(s=>s.event===ev).sort((x,y)=>x.date.localeCompare(y.date)),cv=$('#progressChart'),ctx=cv.getContext('2d'),W=Math.max(280,cv.clientWidth),H=220,dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.strokeStyle='#26324d';for(let i=0;i<4;i++){let y=25+i*50;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(W-12,y);ctx.stroke()}if(a.length<2){ctx.fillStyle='#9ba8c7';ctx.font='13px system-ui';ctx.fillText(a.length?'Add another swim to chart progress':'No swims yet',Math.max(35,W/2-100),112);$('#progressMsg').textContent=a.length?'Current best: '+(a[0].time||fmt(a[0].seconds)):'No swims yet';$('#progressList').innerHTML=a.map(swimCard).join('');return}let vals=a.map(x=>x.seconds),mn=Math.min(...vals),mx=Math.max(...vals),sp=Math.max(.01,mx-mn),X=i=>45+(W-60)*i/(a.length-1),Y=v=>180-(mx-v)/sp*145;ctx.strokeStyle='#7aa2ff';ctx.lineWidth=2;ctx.beginPath();a.forEach((x,i)=>i?ctx.lineTo(X(i),Y(x.seconds)):ctx.moveTo(X(i),Y(x.seconds)));ctx.stroke();ctx.fillStyle='#dbe5ff';a.forEach((x,i)=>{ctx.beginPath();ctx.arc(X(i),Y(x.seconds),3,0,Math.PI*2);ctx.fill()});$('#progressMsg').textContent=`${a.length} swims · ${fmt(mx-mn)} sec range`;$('#progressList').innerHTML=a.slice().reverse().map(swimCard).join('')}
function openSwim(id){let s=all().find(x=>x.id===id);$('#modalBody').innerHTML=`<h2>${esc(s.event)}</h2><div class="time gold">${esc(s.time||fmt(s.seconds))}</div><div class="small">${esc(s.date)} · ${esc(s.course)} · ${esc(s.stroke)}</div>${s.place?`<p><b>Place:</b> ${esc(s.place)}</p>`:''}${s.notes?`<p><b>Notes:</b> ${esc(s.notes)}</p>`:''}${s.splits?.length?`<h3>Splits</h3>${s.splits.map((x,i)=>`<div class="split"><span>Split ${i+1}</span><b>${esc(x)}</b></div>`).join('')}`:''}<h3>Event History</h3>${all().filter(x=>x.event===s.event&&x.course===s.course).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="split"><span>${esc(x.date)}</span><b>${esc(x.time||fmt(x.seconds))}</b></div>`).join('')}`;showModal()}
function seedLists(){LISTS.dates=uniq([...(LISTS.dates||[]),...all().map(s=>s.date)]);LISTS.courses=uniq([...(LISTS.courses||[]),...all().map(s=>s.course)]);LISTS.events=uniq([...(LISTS.events||[]),...all().map(s=>s.event)]);LISTS.places=uniq([...(LISTS.places||[]),...all().map(s=>s.place)]);saveLocalOnly()}function saveLists(){queueSync()}function opts(a,ph){return `<option value="">${ph}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join('')+`<option value="__add">＋ Add new…</option>`}function strokeFor(e){let z=e.toLowerCase();if(z.includes('free'))return'Freestyle';if(z.includes('back'))return'Backstroke';if(z.includes('breast')||z.includes(' br'))return'Breaststroke';if(z.includes('fly'))return'Butterfly';if(z.includes('im')||z.includes('medley'))return'Individual Medley';return'Other'}function addChoice(id,key,label){let el=$('#'+id);if(el.value!=='__add')return;let v=prompt('Add new '+label+':');if(!v){el.value='';return}v=v.trim();if(!v){el.value='';return}LISTS[key]=uniq([...LISTS[key],v]);saveLists();el.innerHTML=opts(LISTS[key],'Select '+label);el.value=v}
function openAdd(){seedLists();$('#modalBody').innerHTML=`<h2>Add Event</h2><p class="small">Record a new swim time.</p><label class="small">Event</label><select id="aEvent" onchange="addChoice('aEvent','events','event')">${opts(LISTS.events,'Select event')}</select><label class="small">Course</label><select id="aCourse" onchange="addChoice('aCourse','courses','course')">${opts(LISTS.courses,'Select course')}</select><label class="small">Date</label><input id="aDate" type="date" value="${new Date().toLocaleDateString('en-CA')}"><label class="small">Time</label><input id="aTime" placeholder="39.35 or 1:28.54"><label class="small">Splits</label><input id="aSplits" placeholder="Optional: 45.29, 50.05, 49.93, 46.24"><label class="small">Place</label><select id="aPlace" onchange="addChoice('aPlace','places','place')">${opts(LISTS.places,'Optional place')}</select><label class="small">Notes</label><textarea id="aNotes" rows="3" placeholder="Optional notes"></textarea><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveAdd()">Save Event</button>`;showModal()}function parseTime(t){let p=t.trim().split(':').map(Number);return p.length===2?p[0]*60+p[1]:p[0]}function saveAdd(){let t=$('#aTime').value.trim(),sec=parseTime(t),event=$('#aEvent').value,date=$('#aDate').value,course=$('#aCourse').value;if(!event||!t||!date||!course||!Number.isFinite(sec)){alert('Event, course, date and time are required.');return}EXTRA.push({id:'user-'+Date.now(),event,stroke:strokeFor(event),distance:Number(event.match(/\d+/)?.[0]||0),time:t,seconds:sec,date,course,splits:$('#aSplits').value.split(',').map(x=>x.trim()).filter(Boolean),place:$('#aPlace').value,notes:$('#aNotes').value.trim()});LISTS.courses=uniq([...LISTS.courses,course]);LISTS.events=uniq([...LISTS.events,event]);if($('#aPlace').value)LISTS.places=uniq([...LISTS.places,$('#aPlace').value]);saveLists();saveUser();closeModal();renderAll()}
function validGoals(){return Object.entries(GOALS).filter(([e,g])=>e&&Number.isFinite(Number(g))&&Number(g)>0)}function goalRows(){let rows=validGoals();if(!rows.length)return `<div class="empty"><p>No goals set yet</p><button class="goldBtn" onclick="goalEditor()">＋ Set Goal</button></div>`;return rows.map(([e,g])=>{let pb=bests().filter(x=>x.event===e).sort((a,b)=>a.seconds-b.seconds)[0];let pct=pb?Math.max(0,Math.min(100,(Number(g)/pb.seconds)*100)):0;return `<div class="card"><div class="top"><div><b>${esc(e)}</b><div class="time">${fmt(g)}</div>${pb?`<div class="small">PB ${fmt(pb.seconds)}</div>`:'<div class="small">No swim time yet</div>'}</div><button onclick="goalEditor('${encodeURIComponent(e)}')">Edit</button></div>${pb?`<div class="goalbar"><div class="goalfill" style="width:${pct}%"></div></div>`:''}</div>`}).join('')}function openGoals(){$('#modalBody').innerHTML=`<h2>Goals</h2>${goalRows()}${validGoals().length?'<button class="goldBtn" style="width:100%;margin-top:10px" onclick="goalEditor()">＋ Set Goal</button>':''}`;showModal()}function goalEditor(enc=''){let old=enc?decodeURIComponent(enc):'',events=uniq([...LISTS.events,...Object.keys(GOALS)]);$('#modalBody').innerHTML=`<h2>${old?'Edit':'Set'} Goal</h2><label class="small">Event</label><select id="gEvent">${events.map(e=>`<option ${e===old?'selected':''}>${esc(e)}</option>`).join('')}</select><label class="small">Goal time</label><input id="gTime" value="${old&&GOALS[old]?fmt(GOALS[old]):''}" placeholder="38.00 or 1:25.00"><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveGoal('${encodeURIComponent(old)}')">Save Goal</button>${old?'<button class="danger" style="width:100%;margin-top:8px" onclick="deleteGoal(\''+encodeURIComponent(old)+'\')">Remove Goal</button>':''}`;showModal()}function saveGoal(oldEnc){let old=decodeURIComponent(oldEnc||''),e=$('#gEvent').value,t=$('#gTime').value,s=parseTime(t);if(!e||!Number.isFinite(s)||s<=0){alert('Choose an event and enter a valid goal time.');return}if(old&&old!==e)delete GOALS[old];GOALS[e]=s;queueSync();openGoals()}function deleteGoal(enc){let e=decodeURIComponent(enc);if(confirm('Remove the goal for '+e+'?')){delete GOALS[e];queueSync();openGoals()}}
function manageList(key,title,desc){let arr=LISTS[key]||[];$('#modalBody').innerHTML=`<h2>${title}</h2><p class="small">${desc}</p>${arr.length?arr.map((v,i)=>`<div class="split"><span>${esc(v)}</span><span><button onclick="editList('${key}',${i})">Edit</button> <button class="danger" onclick="deleteList('${key}',${i})">Delete</button></span></div>`).join(''):'<div class="empty">Nothing saved yet.</div>'}<button class="goldBtn" style="width:100%;margin-top:12px" onclick="newList('${key}')">＋ Add New</button>`;showModal()}function manageEvents(){manageList('events','Manage Events','These are the event types available when recording a swim.')}function manageCourses(){manageList('courses','Manage Courses','Manage the pool course choices.')}function managePlaces(){manageList('places','Manage Places','Manage saved locations.')}function newList(key){let v=prompt('Add new '+key.slice(0,-1)+':');if(!v||!v.trim())return;LISTS[key]=uniq([...LISTS[key],v.trim()]);saveLists();reopenManager(key)}function editList(key,i){let old=LISTS[key][i],v=prompt('Edit:',old);if(!v||!v.trim())return;v=v.trim();LISTS[key][i]=v;LISTS[key]=uniq(LISTS[key]);if(key==='events'){EXTRA.forEach(s=>{if(s.event===old){s.event=v;s.stroke=strokeFor(v);s.distance=Number(v.match(/\d+/)?.[0]||s.distance)}});if(GOALS[old]!==undefined){GOALS[v]=GOALS[old];delete GOALS[old]}}if(key==='courses')EXTRA.forEach(s=>{if(s.course===old)s.course=v});if(key==='places')EXTRA.forEach(s=>{if(s.place===old)s.place=v});saveLists();saveUser();queueSync();reopenManager(key);renderAll()}function deleteList(key,i){let v=LISTS[key][i];if(!confirm('Remove '+v+' from the dropdown? Existing swim records will not be deleted.'))return;LISTS[key].splice(i,1);saveLists();reopenManager(key)}function reopenManager(k){k==='events'?manageEvents():k==='courses'?manageCourses():managePlaces()}
function openSync(){$('#modalBody').innerHTML=`<h2>GitHub Sync</h2><p class="small">Connect this device to the shared data file. The token is stored only in this browser on this device.</p><label class="small">GitHub owner / username</label><input id="ghOwner" value="${esc(SYNC.owner)}" placeholder="Your GitHub username"><label class="small">Repository</label><input id="ghRepo" value="${esc(SYNC.repo)}" placeholder="Evie_Swim_Tracker"><label class="small">Branch</label><input id="ghBranch" value="${esc(SYNC.branch||'main')}"><label class="small">Data file</label><input id="ghPath" value="${esc(SYNC.path||'data/evie-data.json')}"><label class="small">Fine-grained token</label><input id="ghToken" type="password" value="${esc(SYNC.token)}" placeholder="github_pat_…"><p class="small">Token permission: only this repository, Contents: Read and write.</p><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveSyncSettings()">Save & Sync Now</button><button style="width:100%;margin-top:8px" onclick="syncNow()">Sync Now</button><button class="danger" style="width:100%;margin-top:8px" onclick="disconnectSync()">Disconnect This Device</button>`;showModal()}
async function saveSyncSettings(){SYNC={owner:$('#ghOwner').value.trim(),repo:$('#ghRepo').value.trim(),branch:$('#ghBranch').value.trim()||'main',path:$('#ghPath').value.trim()||'data/evie-data.json',token:$('#ghToken').value.trim()};if(!SYNC.owner||!SYNC.repo||!SYNC.token){alert('Owner, repository and token are required.');return}localStorage.setItem('evieGitHubSync',JSON.stringify(SYNC));try{await cloudLoad();await cloudSave();closeModal();alert('GitHub sync connected. This device now shares Evie data.')}catch(e){alert(e.message+' — check the repository name, branch, file path and token permissions.')}}
async function syncNow(){try{await cloudLoad();await cloudSave();alert('Sync complete.')}catch(e){alert(e.message)}}function disconnectSync(){if(!confirm('Disconnect GitHub sync on this device? Your swim data will stay on the device.'))return;SYNC={owner:'',repo:'',branch:'main',path:'data/evie-data.json',token:''};localStorage.removeItem('evieGitHubSync');updateSyncStatus();closeModal()}
function openBackup(){$('#modalBody').innerHTML=`<h2>Data & Backup</h2><div class="card"><b>Export Backup</b><p class="small">Downloads swims, goals, dropdown lists and swimmer settings.</p><button class="goldBtn" onclick="exportData()">Export Backup</button></div><div class="card"><b>Import Backup</b><p class="small">Restore data from a previous Evie Swim Tracker backup.</p><button onclick="$('#importFile').click()">Import Backup</button></div><p class="small">App updates do not clear browser-saved data. Export a backup before major changes for extra protection.</p>`;showModal()}function exportData(){let blob=new Blob([JSON.stringify({...dataPayload(),exported:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='evie-swim-tracker-backup.json';a.click();URL.revokeObjectURL(u)}
$('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);EXTRA=j.swims||[];GOALS=j.goals||{};if(j.lists)LISTS=j.lists;if(j.profile)PROFILE=j.profile;saveUser();saveLists();localStorage.setItem('evieGoals',JSON.stringify(GOALS));localStorage.setItem('evieProfile',JSON.stringify(PROFILE));seedLists();queueSync();renderAll();closeModal();alert('Backup imported')}catch{alert('Could not read backup')}};r.readAsText(f);e.target.value=''};
function openSettings(){$('#modalBody').innerHTML=`<h2>Settings</h2><label class="small">Swimmer name</label><input id="sName" value="${esc(PROFILE.name)}"><label class="small">Team</label><input id="sTeam" value="${esc(PROFILE.team)}"><label class="small">Age</label><input id="sAge" type="number" min="1" max="99" value="${esc(PROFILE.age)}"><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveSettings()">Save Settings</button>`;showModal()}function saveSettings(){PROFILE={name:$('#sName').value.trim()||'Evelyn Fisher',team:$('#sTeam').value.trim()||'',age:Number($('#sAge').value)||12};queueSync();renderProfile();closeModal()}function renderProfile(){$('#heroName').textContent=PROFILE.name;$('#heroTeam').textContent=PROFILE.team;$('#heroAge').textContent=PROFILE.age;$('#headProfile').textContent=`${PROFILE.name} · ${PROFILE.team} · Age ${PROFILE.age}`}
function saveUser(){queueSync()}function showModal(){$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}function renderAll(){dashboard();times();progress()}
['q','stroke','sort'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',times));$('#progressEvent').addEventListener('change',drawProgress);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on');if(b.dataset.p==='progress')progress()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');boot();
</script></body></html>
