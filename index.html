let BASE=[],EXTRA=JSON.parse(localStorage.getItem('evieSwims')||'[]'),DELETED=JSON.parse(localStorage.getItem('evieDeletedSwims')||'{}'),GOALS=JSON.parse(localStorage.getItem('evieGoals')||'{}'),LISTS=JSON.parse(localStorage.getItem('evieLists')||'null')||{courses:['SCY','LCM','SCM'],events:[],places:[]},PROFILE=JSON.parse(localStorage.getItem('evieProfile')||'null')||{name:'Evelyn Fisher',team:'PEAQ',age:12},VIDEOS=JSON.parse(localStorage.getItem('evieVideos')||'{}'),VIDEO_DELETES=JSON.parse(localStorage.getItem('evieVideoDeletes')||'{}'),MEETS=JSON.parse(localStorage.getItem('evieMeets')||'[]'),syncTimer=null,cloudSavePromise=null,DIRTY_GOALS=new Set();const $=s=>document.querySelector(s),all=()=>[...BASE,...EXTRA];
function isOfficial(s){return s?.official!==false&&s?.status!=='unofficial'}function statusBadge(s){return `<span class="pill">${isOfficial(s)?'Official':'Unofficial'}</span>`}function officialSwims(){return all().filter(isOfficial)}

const SUPABASE_KEY='sb_publishable_f9VBvG6tj3o_YHMOML9bCA_FvTKZ3d4';
const CLOUD_KEY='evie_tracker';

let LAST_CLOUD_UPDATED=null,backgroundSyncBusy=false;

function dataPayload(){applyDeletes();return {version:6,updated:new Date().toISOString(),swims:EXTRA,deletedSwims:DELETED,goals:GOALS,lists:{courses:LISTS.courses||[],events:LISTS.events||[],places:LISTS.places||[]},profile:PROFILE,videos:VIDEOS,videoDeletes:VIDEO_DELETES,meets:MEETS}}
function saveLocalOnly(){localStorage.setItem('evieSwims',JSON.stringify(EXTRA));localStorage.setItem('evieDeletedSwims',JSON.stringify(DELETED));localStorage.setItem('evieGoals',JSON.stringify(GOALS));localStorage.setItem('evieLists',JSON.stringify(LISTS));localStorage.setItem('evieProfile',JSON.stringify(PROFILE));localStorage.setItem('evieVideos',JSON.stringify(VIDEOS));localStorage.setItem('evieVideoDeletes',JSON.stringify(VIDEO_DELETES));localStorage.setItem('evieMeets',JSON.stringify(MEETS))}
function applyData(j,merge=true){if(!j)return;DELETED=mergeDeleted(j.deletedSwims,DELETED);EXTRA=merge?mergeSwims(j.swims,EXTRA):(j.swims||[]);applyDeletes();if(j.goals){let localDirty={};DIRTY_GOALS.forEach(k=>{if(GOALS[k]!==undefined)localDirty[k]=GOALS[k]});GOALS={...GOALS,...j.goals,...localDirty};}if(j.lists){LISTS.courses=uniq([...(j.lists.courses||[]),...(LISTS.courses||[])]);LISTS.events=uniq([...(j.lists.events||[]),...(LISTS.events||[])]);LISTS.places=uniq([...(j.lists.places||[]),...(LISTS.places||[])])}reconcileGoals();if(j.profile)PROFILE=j.profile;if(j.meets){let mm=new Map(MEETS.map(x=>[x.id,x]));for(let cm of j.meets){let lm=mm.get(cm.id);if(lm){let cheers=new Map([...(cm.cheers||[]),...(lm.cheers||[])].map(c=>[c.id,c]));let lt=Date.parse(lm.updatedAt||lm.created||0)||0,ct=Date.parse(cm.updatedAt||cm.created||0)||0;let newest=lt>=ct?lm:cm,older=lt>=ct?cm:lm;mm.set(cm.id,{...older,...newest,cheers:[...cheers.values()]})}else mm.set(cm.id,cm)}MEETS=[...mm.values()];}if(j.videoDeletes)VIDEO_DELETES={...j.videoDeletes,...VIDEO_DELETES};if(j.videos){VIDEOS={...VIDEOS,...j.videos};for(let [sid,marks] of Object.entries(VIDEO_DELETES)){if(!VIDEOS[sid])continue;VIDEOS[sid]=VIDEOS[sid].filter(v=>!marks?.[v.path]);if(!VIDEOS[sid].length)delete VIDEOS[sid]}}saveLocalOnly()}
function syncConfigured(){return true}
function sbHeaders(extra={}){return {apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...extra}}
async function cloudFetch(){let u=SUPABASE_URL+'/rest/v1/swim_tracker_data?data_key=eq.'+encodeURIComponent(CLOUD_KEY)+'&select=data,updated_at';let r=await fetch(u,{headers:sbHeaders(),cache:'no-store'});if(!r.ok)throw new Error('Cloud read failed ('+r.status+')');let rows=await r.json();return rows[0]||null}
async function cloudLoad(){updateSyncStatus('Checking cloud…');let row=await cloudFetch();if(!row){updateSyncStatus('Cloud ready — no shared data yet');return false}applyData(row.data,true);LAST_CLOUD_UPDATED=row.updated_at||null;seedLists();renderAll();updateSyncStatus('Synced '+new Date(row.updated_at).toLocaleString());return true}
async function backgroundCloudLoad(){if(backgroundSyncBusy||document.hidden||cloudSavePromise)return;try{backgroundSyncBusy=true;let row=await cloudFetch();if(!row)return;if(row.updated_at&&row.updated_at!==LAST_CLOUD_UPDATED){applyData(row.data,true);LAST_CLOUD_UPDATED=row.updated_at;seedLists();renderAll();updateSyncStatus('Auto-synced '+new Date(row.updated_at).toLocaleTimeString())}}catch(e){console.warn('Background sync:',e)}finally{backgroundSyncBusy=false}}
function startAutoSync(){setInterval(()=>{backgroundCloudLoad();loadCloudMeets().then(()=>{let m=activeMeet();if(m)refreshMeetCloud(m.id,false)}).catch(()=>{})},5000);window.addEventListener('focus',backgroundCloudLoad);document.addEventListener('visibilitychange',()=>{if(!document.hidden)backgroundCloudLoad()})}
async function cloudSaveOnce(){updateSyncStatus('Saving…');let row=await cloudFetch();if(row?.data)applyData(row.data,true);let body={data_key:CLOUD_KEY,data:dataPayload(),updated_at:new Date().toISOString()};let u=SUPABASE_URL+'/rest/v1/swim_tracker_data?on_conflict=data_key';let r=await fetch(u,{method:'POST',headers:sbHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});if(!r.ok){let t=await r.text();throw new Error('Cloud save failed ('+r.status+') '+t)}DIRTY_GOALS.clear();saveLocalOnly();renderAll();let latest=await cloudFetch().catch(()=>null);if(latest?.updated_at)LAST_CLOUD_UPDATED=latest.updated_at;updateSyncStatus('Synced');return true}
async function cloudSave(){if(cloudSavePromise)return cloudSavePromise;cloudSavePromise=cloudSaveOnce();try{return await cloudSavePromise}finally{cloudSavePromise=null}}
function queueSync(){saveLocalOnly();clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudSave().catch(e=>{updateSyncStatus('Sync error — tap to retry');console.error(e)}),500)}
function updateSyncStatus(t){let e=$('#syncStatus');if(e)e.textContent=t||'Supabase shared data connected'}
async function syncNow(){try{await cloudLoad();closeModal();alert('Sync complete.')}catch(e){updateSyncStatus('Sync error');alert(e.message)}}
async function uploadThisDevice(){if(!confirm('Upload the data currently on THIS device to the shared cloud? Use this first on the device that has the newest swim times.'))return;try{updateSyncStatus('Uploading…');let body={data_key:CLOUD_KEY,data:dataPayload(),updated_at:new Date().toISOString()};let u=SUPABASE_URL+'/rest/v1/swim_tracker_data?on_conflict=data_key';let r=await fetch(u,{method:'POST',headers:sbHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});if(!r.ok)throw new Error('Upload failed ('+r.status+') '+await r.text());updateSyncStatus('Synced');closeModal();alert('This device is now the shared starting copy. Other devices can Sync Now.')}catch(e){updateSyncStatus('Sync error');alert(e.message)}}
async function boot(){let cheerId=new URLSearchParams(location.search).get('cheer');if(cheerId){await cheerPage(cheerId);return}try{let seed=await fetch('data/evie-data.json',{cache:'no-store'}).then(r=>r.json());applyData(seed,true)}catch{} BASE=[];seedLists();renderAll();updateSyncStatus();try{await cloudLoad();await loadCloudMeets();await cleanupMissingVideos()}catch(e){updateSyncStatus('Offline — using saved device data')}startAutoSync()}
function bests(){let m={};officialSwims().forEach(s=>{let k=s.event+'|'+s.course;if(!m[k]||s.seconds<m[k].seconds)m[k]=s});return Object.values(m).sort((a,b)=>a.distance-b.distance||a.event.localeCompare(b.event))}
function previousSwim(s){let a=all().filter(x=>x.event===s.event&&x.course===s.course&&swimKey(x)!==swimKey(s)&&(x.date<s.date||(x.date===s.date&&String(x.id||'')<String(s.id||'')))).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id||'').localeCompare(String(b.id||'')));return a[a.length-1]||null}function changeBadge(s){let p=previousSwim(s);if(!p)return '';let d=Number(p.seconds)-Number(s.seconds);if(Math.abs(d)<.005)return `<div class="drop same">— Same time</div>`;return d>0?`<div class="drop good">▼ Dropped ${fmt(Math.abs(d))} sec</div>`:`<div class="drop bad">▲ Added ${fmt(Math.abs(d))} sec</div>`}function swimCard(s){let pb=isOfficial(s)&&bests().some(x=>x.id===s.id);return `<div class="card ${pb?'pb':''}" onclick="openSwim('${s.id}')"><div class="top"><div><div class="num">${esc(s.event)}</div><div class="name">${esc(s.time||fmt(s.seconds))}</div><div class="meta">${esc(s.date)} · ${esc(s.course)} · ${esc(s.stroke)}</div></div><span>${statusBadge(s)} ${pb?'<span class="pill gold">PB</span>':''}${(VIDEOS[s.id]||[]).length?'<span class="videoTag">🎥 Video</span>':''}</span></div>${changeBadge(s)}</div>`}

function awardsForNewSwim(swim,prevBest){if(!isOfficial(swim))return[];let out=[],n=Number(swim.seconds);if(Number.isFinite(prevBest)&&n<prevBest){let drop=prevBest-n;out.push({icon:'🏅',title:'NEW PERSONAL BEST!',sub:`${fmt(drop)} faster than the previous best`});if(drop>=bigDropNeed(swim.distance))out.push({icon:'🚀',title:'BIG DROP!',sub:`Dropped ${fmt(drop)} in ${swim.event}`})}let g=normalizeGoal(GOALS[swim.event]||{}),prior=all().filter(x=>x.event===swim.event&&x.id!==swim.id);for(let level of ['B','BB','A','AA']){let cut=Number(g[level]||0);if(cut&&n<cut&&!prior.some(x=>Number(x.seconds)<cut)){let icon=level==='B'?'🥉':level==='BB'?'🥈':level==='A'?'🥇':'🏆';out.push({icon,title:`${level} STANDARD ACHIEVED!`,sub:`${swim.event} · Cut ${fmt(cut)}`})}}let log=achievementLog(),date=swim.date;if(log.some(x=>x.type==='speed'&&x.date===date))out.push({icon:'⚡',title:'SPEED DEMON!',sub:'3 or more personal bests at this meet!'});if(log.some(x=>x.type==='fire'&&x.date===date))out.push({icon:'🔥',title:'ON FIRE!',sub:'Personal bests at 3 meets in a row!'});return out.filter((x,i,a)=>a.findIndex(y=>y.title===x.title)===i)}

function badgeData(){let log=achievementLog(),defs=[['🏅','New PB','Beat a previous personal best.','pb'],['🚀','Big Drop','Major drop: 2s in a 50, 4s in a 100, or 8s in a 200+.','big'],['⚡','Speed Demon','Earn 3 or more PBs at the same meet.','speed'],['🔥','On Fire','Earn a PB at 3 consecutive meets.','fire'],['🥉','B Standard','Swim faster than a B time standard.','stdB'],['🥈','BB Standard','Swim faster than a BB time standard.','stdBB'],['🥇','A Standard','Swim faster than an A time standard.','stdA'],['🏆','AA Standard','Swim faster than an AA time standard.','stdAA']];return defs.map(([icon,title,desc,type])=>{let hits=log.filter(x=>x.type===type);return {icon,title,desc,type,count:hits.length,earned:!!hits.length,date:hits.length?hits[0].date:null,hits}})}

function manageList(key,title,desc){let arr=LISTS[key]||[];$('#modalBody').innerHTML=`<h2>${title}</h2><p class="small">${desc}</p>${arr.length?arr.map((v,i)=>`<div class="split"><span>${esc(v)}</span><span><button onclick="editList('${key}',${i})">Edit</button> <button class="danger" onclick="deleteList('${key}',${i})">Delete</button></span></div>`).join(''):'<div class="empty">Nothing saved yet.</div>'}<button class="goldBtn" style="width:100%;margin-top:12px" onclick="newList('${key}')">＋ Add New</button>`;showModal()}function manageEvents(){manageList('events','Manage Events','These are the event types available when recording a swim.')}function manageCourses(){manageList('courses','Manage Courses','Manage the pool course choices.')}function managePlaces(){manageList('places','Manage Places','Manage saved locations.')}function newList(key){let v=prompt('Add new '+key.slice(0,-1)+':');if(!v||!v.trim())return;v=v.trim();LISTS[key]=uniq([...LISTS[key],v]);if(key==='events'&&GOALS[v]===undefined)GOALS[v]=emptyGoal();saveLocalOnly();saveLists();reopenManager(key)}function editList(key,i){let old=LISTS[key][i],v=prompt('Edit:',old);if(!v||!v.trim())return;v=v.trim();LISTS[key][i]=v;LISTS[key]=uniq(LISTS[key]);if(key==='events'){EXTRA.forEach(s=>{if(s.event===old){s.event=v;s.stroke=strokeFor(v);s.distance=Number(v.match(/\d+/)?.[0]||s.distance)}});if(GOALS[old]!==undefined){GOALS[v]=normalizeGoal(GOALS[old]);delete GOALS[old]}else if(GOALS[v]===undefined)GOALS[v]=emptyGoal()}if(key==='courses')EXTRA.forEach(s=>{if(s.course===old)s.course=v});if(key==='places')EXTRA.forEach(s=>{if(s.place===old)s.place=v});saveLists();saveUser();queueSync();reopenManager(key);renderAll()}function deleteList(key,i){let v=LISTS[key][i],msg=key==='events'?'Remove '+v+' from the event list? Existing swims and goal data will be kept.':'Remove '+v+' from the dropdown? Existing swim records will not be deleted.';if(!confirm(msg))return;LISTS[key].splice(i,1);saveLocalOnly();saveLists();reopen function openSync(){$('#modalBody').innerHTML=`<h2>Cloud Sync</h2><p class="small">All devices now share Evie’s data through Supabase. No GitHub token is needed.</p><div class="card"><b>Normal sync</b><p class="small">Pull the latest shared data into this device.</p><button class="goldBtn" style="width:100%" onclick="syncNow()">Sync Now</button></div><div class="card"><b>First-time migration</b><p class="small">Use this ONCE on the phone that currently has the newest swim times. It makes that phone the starting shared copy.</p><button style="width:100%" onclick="uploadThisDevice()">Upload This Device to Cloud</button></div><p class="small">After migration, changes save automatically. Open devices check the cloud every few seconds, so new times appear without refreshing.</p>`;showModal()}

function meetPB(event,course){let a=officialSwims().filter(x=>x.event===event&&(!course||x.course===course));return a.length?Math.min(...a.map(x=>Number(x.seconds))):null}
function meetTarget(event,pb){let g=normalizeGoal(GOALS[event]||{}),levels=['B','BB','A','AA'].filter(k=>g[k]);if(pb==null)return levels.length?`${levels[0]} ${fmt(g[levels[0]])}`:'No standard set';let n=levels.find(k=>pb>=g[k]);return n?`${n} ${fmt(g[n])} · ${fmt(pb-g[n])} sec to go`:'AA achieved 🏆'}
async function meetCloudFetch(id=''){let q=id?'?id=eq.'+encodeURIComponent(id)+'&select=id,meet_data,updated_at':'?select=id,meet_data,updated_at&order=updated_at.desc';let r=await fetch(SUPABASE_URL+'/rest/v1/swim_meets'+q,{headers:sbHeaders(),cache:'no-store'});if(!r.ok)throw new Error('Meet cloud read failed ('+r.status+')');return await r.json()}

async function fetchMeetCheers(id){let u=SUPABASE_URL+'/rest/v1/cheer_messages?meet_id=eq.'+encodeURIComponent(id)+'&select=id,meet_id,sender_name,message,created_at&order=created_at.desc',r=await fetch(u,{headers:sbHeaders(),cache:'no-store'});if(!r.ok)throw new Error('Cheer read failed ('+r.status+')');return await r.json()}

async function createMeet(){let name=$('#mName').value.trim(),date=$('#mDate').value,course=$('#mCourse').value;if(!name||!date||!course){alert('Meet name, date and course are required.');return}let now=new Date().toISOString(),m={id:'meet-'+Date.now(),name,date,course,place:$('#mPlace').value||'',events:[],cheers:[],created:now,updatedAt:now,finished:false};MEETS.push(m);saveLocalOnly();renderMeet(m.id);try{await meetCloudSave(m)}catch(e){alert('Meet saved on this device, but cloud sync failed: '+e.message)}}
function renderMeet(id){let m=MEETS.find(x=>x.id===id);if(!m)return openMeetMode();let cards=(m.events||[]).map((ev,i)=>{let pb=meetPB(ev,m.course),sw=all().find(x=>x.meetId===m.id&&x.event===ev);return `<div class="card"><div class="top"><div><b>${esc(ev)}</b><div class="small">PB ${pb!=null?fmt(pb):'—'} · 🎯 ${esc(meetTarget(ev,pb))}</div>${sw?`<div class="time gold">${fmt(sw.seconds)}</div><div class="small">Result recorded · ${isOfficial(sw)?'Official':'Unofficial'}</div>`:''}</div><button class="danger" onclick="removeMeetEvent('${m.id}',${i})">✕</button></div>${!sw?`<button class="goldBtn" style="width:100%;margin-top:9px" onclick="meetResult('${m.id}','${encodeURIComponent(ev)}')">Enter Result</button>`:`<button style="width:100%;margin-top:9px" onclick="openSwim('${sw.id}')">View Result</button>`}</div>`}).join('');let cheers=(m.cheers||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).map(c=>`<div class="card"><b>💜 ${esc(c.name)}</b><div style="margin-top:5px">${esc(c.message)}</div><div class="small">${new Date(c.at).toLocaleString()}</div></div>`).join('');$('#modalBody').innerHTML=`<h2>🏊 ${esc(m.name)}</h2><div class="small">${esc(m.date)} · ${esc(m.course)}${m.place?' · '+esc(m.place):''}</div><div class="row"><button onclick="chooseMeetEvents('${m.id}')">＋ Add Events</button><button onclick="shareMeet('${m.id}')">💜 Share Cheer Link</button></div>${cards||'<div class="empty">Add today’s events when you get the lineup.</div>'}<h3>💜 Cheer Squad</h3>${cheers||'<div class="empty">Encouragement messages will appear here.</div>'}<button class="danger" style="width:100%;margin-top:12px" onclick="finishMeet('${m.id}')">Finish Meet</button>`;showModal()}
function chooseMeetEvents(id){let m=MEETS.find(x=>x.id===id),set=new Set(m.events||[]);$('#modalBody').innerHTML=`<h2>Select Today’s Events</h2><p class="small">Choose as many as you know now. You can come back and add more later.</p>${(LISTS.events||[]).map((e,i)=>`<label class="card" style="display:flex;gap:10px;align-items:center"><input style="width:auto" type="checkbox" class="meetEv" value="${esc(e)}" ${set.has(e)?'checked':''}><b>${esc(e)}</b></label>`).join('')}<button class="goldBtn" style="width:100%" onclick="saveMeetEvents('${id}')">Save Events</button>`;showModal()}
async function saveMeetEvents(id){let m=MEETS.find(x=>x.id===id);m.events=[...document.querySelectorAll('.meetEv:checked')].map(x=>x.value);m.updatedAt=new Date().toISOString();saveLocalOnly();renderMeet(id);try{await meetCloudSave(m)}catch(e){alert('Events saved on this device, but cloud sync failed: '+e.message)}}
async function removeMeetEvent(id,i){let m=MEETS.find(x=>x.id===id);m.events.splice(i,1);m.updatedAt=new Date().toISOString();saveLocalOnly();renderMeet(id);try{await meetCloudSave(m)}catch(e){alert('Event removed on this device, but cloud sync failed: '+e.message)}}
function meetResult(id,enc){let m=MEETS.find(x=>x.id===id),ev=decodeURIComponent(enc);$('#modalBody').innerHTML=`<h2>${esc(ev)} Result</h2><div class="small">${esc(m.name)} · ${esc(m.course)}</div><label class="small">Time</label><input id="mrTime" placeholder="31.82"><label class="small">Status</label><select id="mrStatus"><option value="official">Official</option><option value="unofficial">Unofficial</option></select><label class="small">Splits</label><input id="mrSplits" placeholder="Optional"><label class="small">Notes</label><textarea id="mrNotes" rows="2"></textarea><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveMeetResult('${id}','${encodeURIComponent(ev)}')">Save Result</button>`;showModal()}
function saveMeetResult(id,enc){let m=MEETS.find(x=>x.id===id),event=decodeURIComponent(enc),t=$('#mrTime').value.trim(),sec=parseTime(t);if(!t||!Number.isFinite(sec)){alert('Enter a valid time.');return}let official=$('#mrStatus').value==='official',before=officialSwims().filter(x=>x.event===event&&x.course===m.course),prevBest=before.length?Math.min(...before.map(x=>Number(x.seconds))):Infinity,swim={id:'user-'+Date.now(),meetId:id,event,official,eventStatus:official?'official':'unofficial',stroke:strokeFor(event),distance:Number(event.match(/\d+/)?.[0]||0),time:t,seconds:sec,date:m.date,course:m.course,splits:$('#mrSplits').value.split(',').map(x=>x.trim()).filter(Boolean),place:m.place,notes:$('#mrNotes').value.trim()};EXTRA.push(swim);m.updatedAt=new Date().toISOString();queueSync();meetCloudSave(m).catch(e=>console.warn('Meet save:',e));renderAll();let awards=awardsForNewSwim(swim,prevBest);renderMeet(id);if(awards.length)setTimeout(()=>showCelebration(swim,awards),180)}
function shareMeet(id){let u=location.origin+location.pathname+'?cheer='+encodeURIComponent(id);navigator.clipboard?.writeText(u).then(()=>alert('Cheer Squad link copied! Send it to Grandma or anyone you want cheering for Evie.')).catch(()=>prompt('Copy this Cheer Squad link:',u))}
async function finishMeet(id){if(!confirm('Finish this meet?'))return;let m=MEETS.find(x=>x.id===id);m.finished=true;m.finishedAt=new Date().toISOString();m.updatedAt=m.finishedAt;saveLocalOnly();queueSync();try{await meetCloudSave(m)}catch(e){alert('Meet finished locally, but cloud sync failed: '+e.message);return}closeModal();alert('Meet saved. 💜')}
async function cheerPage(id){document.querySelector('header').style.display='none';document.querySelector('nav').style.display='none';document.querySelector('main').innerHTML='<div class="card"><h2>💜 Cheer Squad</h2><div class="small">Loading Evie’s meet…</div></div>';try{let rows=await meetCloudFetch(id),m=rows[0]?.meet_data;if(!m)throw new Error('This meet link is not available.');let ev=(m.events||[]).map(e=>`<span class="pill">${esc(e)}</span>`).join(' ');document.querySelector('main').innerHTML=`<div class="card hero"><h2>💜 Cheer for Evie!</h2><div>${esc(m.name)}</div><div class="small">${esc(m.date)} · ${esc(m.course)}</div><div style="margin-top:10px">${ev}</div></div><div class="card"><label class="small">Your name</label><input id="cheerName" placeholder="Grandma"><label class="small">Your message</label><textarea id="cheerMsg" rows="4" maxlength="300" placeholder="Good luck Evie! We love you! ❤️"></textarea><button class="goldBtn" style="width:100%;margin-top:12px" onclick="sendCheer('${id}')">Send Cheer 💜</button><div id="cheerStatus" class="small" style="margin-top:10px;text-align:center"></div></div>`}catch(e){document.querySelector('main').innerHTML=`<div class="card"><h2>💜 Cheer Squad</h2><p>${esc(e.message)}</p></div>`}}
async function sendCheer(id){let name=$('#cheerName').value.trim(),message=$('#cheerMsg').value.trim();if(!name||!message){alert('Enter your name and a message.');return}let st=$('#cheerStatus');st.textContent='Sending…';try{let body={meet_id:id,sender_name:name,message},r=await fetch(SUPABASE_URL+'/rest/v1/cheer_messages',{method:'POST',headers:sbHeaders({Prefer:'return=minimal'}),body:JSON.stringify(body)});if(!r.ok)throw new Error('Could not send message ('+r.status+').');$('#cheerMsg').value='';st.textContent='Cheer sent! 💜'}catch(e){st.textContent=e.message}}

function openSettings(){$('#modalBody').innerHTML=`<h2>Settings</h2><label class="small">Swimmer name</label><input id="sName" value="${esc(PROFILE.name)}"><label class="small">Team</label><input id="sTeam" value="${esc(PROFILE.team)}"><label class="small">Age</label><input id="sAge" type="number" min="1" max="99" value="${esc(PROFILE.age)}"><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveSettings()">Save Settings</button>`;showModal()}function saveSettings(){PROFILE={name:$('#sName').value.trim()||'Evelyn Fisher',team:$('#sTeam').value.trim()||'',age:Number($('#sAge').value)||12};queueSync();renderProfile();closeModal()}function renderProfile(){$('#heroName').textContent=PROFILE.name;$('#heroTeam').textContent=PROFILE.team;$('#heroAge').textContent=PROFILE.age;$('#headProfile').textContent=`${PROFILE.name} · ${PROFILE.team} · Age ${PROFILE.age}`}
function saveUser(){queueSync()}function showModal(){$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}function renderAll(){dashboard();times();progress();renderTrophyRoom()}
$('#progressEvent').addEventListener('change',drawProgress);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on');if(b.dataset.p==='progress')progress();if(b.dataset.p==='trophies')renderTrophyRoom()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');boot();
</script></body></html>
