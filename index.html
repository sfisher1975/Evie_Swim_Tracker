function videoStoragePath(v){

  let u=String(v?.url||'');

    let x=new URL(u,location.href),m=x.pathname.match(/\/storage\/v1\/object\/(?:public|sign)\/race-videos\/(.+)$/);
    return m?decodeURIComponent(m[1]):'';
  }catch{return ''}
}
async function signVideo(v,retry=true){

    let r=await fetch(endpoint,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({expiresIn:3600}),cache:'no-store'});
    if(r.status===401&&retry&&await refreshSession())return signVideo(v,false);

    if(u.startsWith('http'))return u;
    if(u.startsWith('/storage/v1/'))return SUPABASE_URL+u;
    if(u.startsWith('/object/'))return SUPABASE_URL+'/storage/v1'+u;
    return SUPABASE_URL+'/storage/v1/'+u.replace(/^\/+/, '');
  }catch(e){console.warn('Could not sign race video',e);return ''}
}

async function hydrateVisibleVideos(){
  let players=[...document.querySelectorAll('video.videoPlayer[data-video-path]')];
  for(let el of players){
    let path=el.dataset.videoPath;if(!path)continue;
    try{
      let u=SUPABASE_URL+'/storage/v1/object/authenticated/'+VIDEO_BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/');
      let r=await fetch(u,{headers:authHeaders(),cache:'no-store'});
      if(r.status===401&&await refreshSession())r=await fetch(u,{headers:authHeaders(),cache:'no-store'});
      if(!r.ok)throw new Error('Video download failed ('+r.status+')');
      let blob=await r.blob();
      if(el._blobUrl)URL.revokeObjectURL(el._blobUrl);
      el._blobUrl=URL.createObjectURL(blob);
      el.src=el._blobUrl;el.load();
    }catch(e){console.error(e);el.insertAdjacentHTML('afterend','<div class="small" style="color:#ff8a8a;margin-top:6px">Video could not be loaded. '+esc(e.message)+'</div>')}
  }
}

function awardsForNewSwim(swim,prevBest){if(!isOfficial(swim))return[];let out=[],n=Number(swim.seconds);if(Number.isFinite(prevBest)&&n<prevBest){let drop=prevBest-n;out.push({icon:'🏅',title:'NEW PERSONAL BEST!',sub:`${fmt(drop)} faster than the previous best`});if(drop>=bigDropNeed(swim.distance))out.push({icon:'🚀',title:'BIG DROP!',sub:`Dropped ${fmt(drop)} in ${swim.event}`})}let g=normalizeGoal(GOALS[swim.event]||{}),prior=all().filter(x=>x.event===swim.event&&x.id!==swim.id);for(let level of ['B','BB','A','AA']){let cut=Number(g[level]||0);if(cut&&n<cut&&!prior.some(x=>Number(x.seconds)<cut)){let icon=level==='B'?'🥉':level==='BB'?'🥈':level==='A'?'🥇':'🏆';out.push({icon,title:`${level} STANDARD ACHIEVED!`,sub:`${swim.event} · Cut ${fmt(cut)}`})}}let log=achievementLog(),date=swim.date;if(log.some(x=>x.type==='speed'&&x.date===date))out.push({icon:'⚡',title:'SPEED DEMON!',sub:'3 or more personal bests at this meet!'});if(log.some(x=>x.type==='fire'&&x.date===date))out.push({icon:'🔥',title:'ON FIRE!',sub:'Personal bests at 3 meets in a row!'});return out.filter((x,i,a)=>a.findIndex(y=>y.title===x.title)===i)}

function badgeData(){let log=achievementLog(),defs=[['🏅','New PB','Beat a previous personal best.','pb'],['🚀','Big Drop','Major drop: 2s in a 50, 4s in a 100, or 8s in a 200+.','big'],['⚡','Speed Demon','Earn 3 or more PBs at the same meet.','speed'],['🔥','On Fire','Earn a PB at 3 consecutive meets.','fire'],['🥉','B Standard','Swim faster than a B time standard.','stdB'],['🥈','BB Standard','Swim faster than a BB time standard.','stdBB'],['🥇','A Standard','Swim faster than an A time standard.','stdA'],['🏆','AA Standard','Swim faster than an AA time standard.','stdAA']];return defs.map(([icon,title,desc,type])=>{let hits=log.filter(x=>x.type===type);return {icon,title,desc,type,count:hits.length,earned:!!hits.length,date:hits.length?hits[0].date:null,hits}})}

function manageList(key,title,desc){let arr=LISTS[key]||[];$('#modalBody').innerHTML=`<h2>${title}</h2><p class="small">${desc}</p>${arr.length?arr.map((v,i)=>`<div class="split"><span>${esc(v)}</span><span><button onclick="editList('${key}',${i})">Edit</button> <button class="danger" onclick="deleteList('${key}',${i})">Delete</button></span></div>`).join(''):'<div class="empty">Nothing saved yet.</div>'}<button class="goldBtn" style="width:100%;margin-top:12px" onclick="newList('${key}')">＋ Add New</button>`;showModal()}function manageEvents(){if(!requireAdmin(manageEvents,'Admin access is required to manage events.'))return;manageList('events','Manage Events','These are the event types available when recording a swim.')}function manageCourses(){if(!requireAdmin(manageCourses,'Admin access is required to manage courses.'))return;manageList('courses','Manage Courses','Manage the pool course choices.')}function managePlaces(){if(!requireAdmin(managePlaces,'Admin access is required to manage places.'))return;manageList('places','Manage Places','Manage saved locations.')}function newList(key){if(!requireAdmin())return;let v=prompt('Add new '+key.slice(0,-1)+':');if(!v||!v.trim())return;v=v.trim();LISTS[key]=uniq([...LISTS[key],v]);if(key==='events'&&GOALS[v]===undefined)GOALS[v]=emptyGoal();saveLocalOnly();saveLists();reopenManager(key)}function editList(key,i){if(!requireAdmin())return;let old=LISTS[key][i],v=prompt('Edit:',old);if(!v||!v.trim())return;v=v.trim();LISTS[key][i]=v;LISTS[key]=uniq(LISTS[key]);if(key==='events'){EXTRA.forEach(s=>{if(s.event===old){s.event=v;s.stroke=strokeFor(v);s.distance=Number(v.match(/\d+/)?.[0]||s.distance)}});if(GOALS[old]!==undefined){GOALS[v]=normalizeGoal(GOALS[old]);delete GOALS[old]}else if(GOALS[v]===undefined)GOALS[v]=emptyGoal()}if(key==='courses')EXTRA.forEach(s=>{if(s.course===old)s.course=v});if(key==='places')EXTRA.forEach(s=>{if(s.place===old)s.place=v});saveLists();saveUser();queueSync();reopenManager(key);renderAll()} function openBackup(){if(!requireAdmin(openBackup,'Admin access is required for backup and restore.'))return;$('#modalBody').innerHTML=`<h2>Data & Backup</h2><div class="card"><b>Export Backup</b><p class="small">Downloads swims, goals, dropdown lists and swimmer settings.</p><button class="goldBtn" onclick="exportData()">Export Backup</button></div><div class="card"><b>Import Backup</b><p class="small">Restore data from a previous Evie Swim Tracker backup.</p><button onclick="$('#importFile').click()">Import Backup</button></div><p class="small">App updates do not clear browser-saved data. Export a backup before major changes for extra protection.</p>`;showModal()}function exportData(){let blob=new Blob([JSON.stringify({...dataPayload(),exported:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='evie-swim-tracker-backup.json';a.click();URL.revokeObjectURL(u)}

async function fetchMeetCheers(id){let u=SUPABASE_URL+'/rest/v1/cheer_messages?meet_id=eq.'+encodeURIComponent(id)+'&select=id,meet_id,sender_name,message,created_at&order=created_at.desc',r=await fetch(u,{headers:sbHeaders(),cache:'no-store'});if(!r.ok)throw new Error('Cheer read failed ('+r.status+')');return await r.json()}
async function refreshMeetCloud(id,rerender=false){try{await loadCloudMeets();let m=MEETS.find(x=>x.id===id);if(m){let rows=await fetchMeetCheers(id);m.cheers=rows.map(c=>({id:String(c.id),name:c.sender_name,message:c.message,at:c.created_at}));saveLocalOnly();if(rerender&&$('#modal')?.classList.contains('on'))renderMeet(id)}}catch(e){console.warn('Meet sync:',e)}}
function meetDisplayName(name){let n=String(name||'').trim();return /^(test|test meet)$/i.test(n)?'Meet':(n||'Meet')}
function activeMeet(){return MEETS.filter(m=>!m.finished).sort((a,b)=>String(b.created).localeCompare(String(a.created)))[0]||null}
function openCreateMeetForm(){if(!requireAdmin(openCreateMeetForm,'Admin access is required to start a meet.'))return;seedLists();$('#modalBody').innerHTML=`<h2>🏊 Create Meet</h2><p class="small">Create the meet when you get the lineup. You can add or remove events anytime.</p><label class="small">Meet name</label><input id="mName" value="Meet" placeholder="Meet name"><label class="small">Date</label><input id="mDate" type="date" value="${new Date().toLocaleDateString('en-CA')}"><label class="small">Course</label><select id="mCourse">${opts(LISTS.courses,'Select course')}</select><label class="small">Place (optional)</label><select id="mPlace">${opts(LISTS.places,'Optional place')}</select><button class="goldBtn" style="width:100%;margin-top:12px" onclick="createMeet()">Start Meet</button>`;showModal()}
async function openMeetMode(){try{await loadCloudMeets()}catch(e){console.warn('Meet cloud:',e)}let m=activeMeet();if(!m){$('#modalBody').innerHTML=`<h2>🏊 Meet Mode</h2><div class="empty">No active meet right now.</div><button class="goldBtn" style="width:100%;margin-top:12px" onclick="openCreateMeetForm()">${isAdmin()?'＋ Create Meet':'🔓 Unlock Admin to Create Meet'}</button>`;showModal();return}renderMeet(m.id);refreshMeetCloud(m.id,true)}
async function createMeet(){if(!requireAdmin(openCreateMeetForm,'Admin access is required to start a meet.'))return;let name=$('#mName')?.value.trim()||'',date=$('#mDate')?.value||'',course=$('#mCourse')?.value||'',place=$('#mPlace')?.value||'';if(!name||!date||!course){alert('Meet name, date and course are required.');return}let now=new Date().toISOString(),m={id:'meet-'+Date.now(),name,date,course,place,events:[],draftResults:[],cheers:[],created:now,updatedAt:now,finished:false};MEETS.push(m);saveLocalOnly();renderMeet(m.id);try{let ok=await meetCloudSave(m);if(!ok)throw new Error('Admin session was not available for cloud save.')}catch(e){alert('Meet was created on this device, but cloud sync failed: '+e.message)}}
function renderMeet(id){let m=MEETS.find(x=>x.id===id);if(!m)return openMeetMode();let drafts=m.draftResults||[],cards=(m.events||[]).map((ev,i)=>{let pb=meetPB(ev,m.course),draft=drafts.find(x=>x.event===ev),sw=m.finished?all().find(x=>x.meetId===m.id&&x.event===ev):null,result=draft||sw;return `<div class="card"><div class="top"><div><b>${esc(ev)}</b><div class="small">PB ${pb!=null?fmt(pb):'—'} · 🎯 ${esc(meetTarget(ev,pb))}</div>${result?`<div class="time gold">${fmt(result.seconds)}</div><div class="small">${m.finished?'Saved result':'Temporary result'} · ${isOfficial(result)?'Official':'Unofficial'}</div>`:''}</div>${isAdmin()&&!m.finished?`<button class="danger" onclick="removeMeetEvent('${m.id}',${i})">✕</button>`:''}</div>${!m.finished&&isAdmin()?`<button class="${draft?'':'goldBtn'}" style="width:100%;margin-top:9px" onclick="meetResult('${m.id}','${encodeURIComponent(ev)}')">${draft?'Edit Result':'Enter Result'}</button>`:(sw?`<button style="width:100%;margin-top:9px" onclick="openSwim('${sw.id}')">View Result</button>`:'')}</div>`}).join('');let cheers=(m.cheers||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).map(c=>`<div class="card"><b>💜 ${esc(c.name)}</b><div style="margin-top:5px">${esc(c.message)}</div><div class="small">${new Date(c.at).toLocaleString()}</div></div>`).join('');$('#modalBody').innerHTML=`<h2>🏊 ${esc(meetDisplayName(m.name))}</h2><div class="small">${esc(m.date)} · ${esc(m.course)}${m.place?' · '+esc(m.place):''}</div>${isAdmin()&&!m.finished?`<div class="row"><button onclick="chooseMeetEvents('${m.id}')">＋ Add Events</button><button onclick="shareMeet('${m.id}')">💜 Share Cheer Link</button></div>`:''}${cards||'<div class="empty">Add today’s events when you get the lineup.</div>'}<h3>💜 Cheer Squad</h3>${cheers||'<div class="empty">Encouragement messages will appear here.</div>'}${!m.finished?`<button class="goldBtn" style="width:100%;margin-top:12px" onclick="finishMeet('${m.id}')">${isAdmin()?'🏁 Finish Meet':'🔓 Finish Meet'}</button><button style="width:100%;margin-top:8px" onclick="openCreateMeetForm()">${isAdmin()?'＋ Create New Meet':'🔓 Create New Meet'}</button><button class="danger" style="width:100%;margin-top:8px" onclick="cancelMeet('${m.id}')">${isAdmin()?'Delete Meet':'🔓 Delete Meet'}</button>`:''}`;showModal()}
function chooseMeetEvents(id){setModalReturn(()=>renderMeet(id));let m=MEETS.find(x=>x.id===id),set=new Set(m.events||[]);$('#modalBody').innerHTML=`<h2>Select Today’s Events</h2><p class="small">Choose as many as you know now. You can come back and add more later.</p>${(LISTS.events||[]).map((e,i)=>`<label class="card" style="display:flex;gap:10px;align-items:center"><input style="width:auto" type="checkbox" class="meetEv" value="${esc(e)}" ${set.has(e)?'checked':''}><b>${esc(e)}</b></label>`).join('')}<button class="goldBtn" style="width:100%" onclick="saveMeetEvents('${id}')">Save Events</button>`;showModal()}
async function saveMeetEvents(id){if(!requireAdmin(()=>saveMeetEvents(id),'Admin access is required to save meet events.'))return;let m=MEETS.find(x=>x.id===id);m.events=[...document.querySelectorAll('.meetEv:checked')].map(x=>x.value);m.updatedAt=new Date().toISOString();saveLocalOnly();try{await meetCloudSave(m)}catch(e){alert('Events saved on this device, but cloud sync failed: '+e.message)}returnFromModal(()=>renderMeet(id))}
async function removeMeetEvent(id,i){if(!requireAdmin(()=>removeMeetEvent(id,i),'Admin access is required to remove a meet event.'))return;let m=MEETS.find(x=>x.id===id);m.events.splice(i,1);m.updatedAt=new Date().toISOString();saveLocalOnly();renderMeet(id);try{await meetCloudSave(m)}catch(e){alert('Event removed on this device, but cloud sync failed: '+e.message)}}
function meetResult(id,enc){if(!requireAdmin(()=>meetResult(id,enc),'Admin access is required to enter meet results.'))return;setModalReturn(()=>renderMeet(id));let m=MEETS.find(x=>x.id===id),ev=decodeURIComponent(enc),d=(m.draftResults||[]).find(x=>x.event===ev);$('#modalBody').innerHTML=`<h2>${esc(ev)} Result</h2><div class="small">${esc(m.name)} · ${esc(m.course)} · Saved temporarily until Finish Meet</div><label class="small">Time</label><input id="mrTime" placeholder="31.82" value="${esc(d?.time||'')}"><label class="small">Status</label><select id="mrStatus"><option value="official" ${d?.official===false?'':'selected'}>Official</option><option value="unofficial" ${d?.official===false?'selected':''}>Unofficial</option></select><label class="small">Splits</label><input id="mrSplits" placeholder="Optional" value="${esc((d?.splits||[]).join(', '))}"><label class="small">Notes</label><textarea id="mrNotes" rows="2">${esc(d?.notes||'')}</textarea><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveMeetResult('${id}','${encodeURIComponent(ev)}')">Save Temporary Result</button>${d?`<button class="danger" style="width:100%;margin-top:8px" onclick="clearMeetResult('${id}','${encodeURIComponent(ev)}')">Clear Result</button>`:''}`;showModal()}
async function saveMeetResult(id,enc){if(!requireAdmin(()=>meetResult(id,enc),'Admin access is required to save meet results.'))return;let m=MEETS.find(x=>x.id===id),event=decodeURIComponent(enc),t=$('#mrTime').value.trim(),sec=parseTime(t);if(!t||!Number.isFinite(sec)){alert('Enter a valid time.');return}let official=$('#mrStatus').value==='official',draft={id:'draft-'+id+'-'+event,updatedAt:new Date().toISOString(),meetId:id,event,official,eventStatus:official?'official':'unofficial',stroke:strokeFor(event),distance:Number(event.match(/\d+/)?.[0]||0),time:t,seconds:sec,date:m.date,course:m.course,splits:$('#mrSplits').value.split(',').map(x=>x.trim()).filter(Boolean),place:m.place,notes:$('#mrNotes').value.trim()};m.draftResults=m.draftResults||[];let i=m.draftResults.findIndex(x=>x.event===event);if(i>=0)m.draftResults[i]=draft;else m.draftResults.push(draft);m.updatedAt=new Date().toISOString();saveLocalOnly();try{await meetCloudSave(m)}catch(e){alert('Result saved on this device, but meet sync failed: '+e.message)}returnFromModal(()=>renderMeet(id))}
async function clearMeetResult(id,enc){if(!requireAdmin(()=>clearMeetResult(id,enc),'Admin access is required to clear meet results.'))return;let m=MEETS.find(x=>x.id===id),event=decodeURIComponent(enc);m.draftResults=(m.draftResults||[]).filter(x=>x.event!==event);m.updatedAt=new Date().toISOString();saveLocalOnly();try{await meetCloudSave(m)}catch(e){alert('Result cleared on this device, but meet sync failed: '+e.message)}returnFromModal(()=>renderMeet(id))}
function shareMeet(id){if(!requireAdmin(()=>shareMeet(id),'Admin access is required to share a meet.'))return;let m=MEETS.find(x=>x.id===id),md=btoa(unescape(encodeURIComponent(JSON.stringify({name:meetDisplayName(m.name),date:m.date,course:m.course,events:m.events||[]}))));let u=location.origin+location.pathname+'?cheer='+encodeURIComponent(id)+'&md='+encodeURIComponent(md);navigator.clipboard?.writeText(u).then(()=>alert('Cheer Squad link copied! Send it to Grandma or anyone you want cheering for Evie.')).catch(()=>prompt('Copy this Cheer Squad link:',u))}
async function deleteMeetCloud(id){let r=await fetch(SUPABASE_URL+'/rest/v1/swim_meets?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:sbHeaders({Prefer:'return=minimal'})});if(!r.ok)throw new Error('Meet delete failed ('+r.status+') '+await r.text());return true}
async function cancelMeet(id){let m=MEETS.find(x=>x.id===id);if(!m||m.finished)return;if(!confirm('Delete this meet and start over?\n\nAll temporary events and results entered for this meet will be discarded. Nothing will be added to swim history.'))return;let original=MEETS.slice();MEETS=MEETS.filter(x=>x.id!==id);saveLocalOnly();try{await deleteMeetCloud(id);let body={data_key:CLOUD_KEY,data:dataPayload(),updated_at:new Date().toISOString()};let u=SUPABASE_URL+'/rest/v1/swim_tracker_data?on_conflict=data_key';let r=await fetch(u,{method:'POST',headers:sbHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});if(!r.ok)throw new Error('Tracker update failed ('+r.status+') '+await r.text());closeModal();renderAll();openMeetMode()}catch(e){MEETS=original;saveLocalOnly();alert('The meet was not deleted because cloud sync failed: '+e.message)}}
async function finishMeet(id){if(!requireAdmin(()=>finishMeet(id),'Admin access is required to finish a meet.'))return;let m=MEETS.find(x=>x.id===id);if(!m||m.finished){alert('This meet has already been finished.');return}let drafts=m.draftResults||[];if(!drafts.length){alert('Enter at least one result before finishing the meet.');return}let review=drafts.map(x=>`${x.event}: ${x.time||fmt(x.seconds)} (${isOfficial(x)?'Official':'Unofficial'})`).join('\n');if(!confirm(`Review these results before saving permanently:\n\n${review}\n\nFinish & save this meet?`))return;for(let d of drafts){if(EXTRA.some(x=>x.meetId===m.id&&x.event===d.event))continue;let before=officialSwims().filter(x=>x.event===d.event&&x.course===m.course),prevBest=before.length?Math.min(...before.map(x=>Number(x.seconds))):Infinity,now=new Date().toISOString(),swim={...d,id:'user-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),updatedAt:now};EXTRA.push(swim);awardsForNewSwim(swim,prevBest)}m.finished=true;m.finishedAt=new Date().toISOString();m.updatedAt=m.finishedAt;m.savedResultCount=drafts.length;saveLocalOnly();try{await cloudSave();await meetCloudSave(m)}catch(e){alert('Results were saved on this device, but cloud sync failed: '+e.message);return}renderAll();closeModal();document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));let homeBtn=document.querySelector('nav button[data-p="dashboard"]');if(homeBtn)homeBtn.classList.add('on');let home=$('#dashboard');if(home)home.classList.add('on')}
async function cheerPage(id,md){
  document.querySelector('header').style.display='none';
  document.querySelector('nav').style.display='none';
  document.querySelector('main').innerHTML='<div class="card"><h2>💜 Cheer Squad</h2><div class="small">Loading Evie’s meet…</div></div>';
  let fallback=null;
  if(md){try{fallback=JSON.parse(decodeURIComponent(escape(atob(md))))}catch{}}
  async function loadPublicMeet(){
    try{
      let rows=await meetCloudFetch(id), live=rows?.[0]?.meet_data||null, m=live||fallback;
      if(!m)throw new Error('This Cheer Squad link is old or incomplete. Ask for a new link from Meet Mode.');
      let drafts=m.draftResults||[], saved=m.finished?all().filter(x=>x.meetId===id):[];
      let events=(m.events||[]).map(event=>{
        let r=drafts.find(x=>x.event===event)||saved.find(x=>x.event===event), result=r?`<b>${esc(r.time||fmt(r.seconds))}</b><span class="small">${isOfficial(r)?'Official':'Unofficial'}</span>`:'<span class="small">Waiting for result</span>';
        return `<div class="split"><span><b>${esc(event)}</b></span><span style="text-align:right">${result}</span></div>`
      }).join('');
      document.querySelector('main').innerHTML=`<div class="card hero"><h2>💜 Cheer for Evie!</h2><div>${esc(meetDisplayName(m.name))}</div><div class="small">${esc(m.date)} · ${esc(m.course)}${m.place?' · '+esc(m.place):''}</div></div><div class="card"><h3>Live Meet Times</h3>${events||'<div class="empty">Events will appear here when they are added.</div>'}<div class="small" style="margin-top:10px;text-align:center">Times update automatically during the meet.</div></div><div class="card"><h3>Send Evie a Cheer</h3><label class="small">Your name</label><input id="cheerName" placeholder="Grandma"><label class="small">Your message</label><textarea id="cheerMsg" rows="4" maxlength="300" placeholder="Good luck Evie! We love you! ❤️"></textarea><button class="goldBtn" style="width:100%;margin-top:12px" onclick="sendCheer('${id}')">Send Cheer 💜</button><div id="cheerStatus" class="small" style="margin-top:10px;text-align:center"></div></div>`;
    }catch(e){document.querySelector('main').innerHTML=`<div class="card"><h2>💜 Cheer Squad</h2><p>${esc(e.message)}</p></div>`}
  }
  await loadPublicMeet();
  setInterval(async()=>{
    if(document.activeElement?.id==='cheerName'||document.activeElement?.id==='cheerMsg')return;
    let name=$('#cheerName')?.value||'',msg=$('#cheerMsg')?.value||'';
    await loadPublicMeet();
    if($('#cheerName'))$('#cheerName').value=name;
    if($('#cheerMsg'))$('#cheerMsg').value=msg;
  },15000);
}
async function sendCheer(id){let name=$('#cheerName').value.trim(),message=$('#cheerMsg').value.trim();if(!name||!message){alert('Enter your name and a message.');return}let st=$('#cheerStatus');st.textContent='Sending…';try{let body={meet_id:id,sender_name:name,message},r=await fetch(SUPABASE_URL+'/rest/v1/cheer_messages',{method:'POST',headers:sbHeaders({Prefer:'return=minimal'}),body:JSON.stringify(body)});if(!r.ok)throw new Error('Could not send message ('+r.status+').');$('#cheerMsg').value='';st.textContent='Cheer sent! 💜'}catch(e){st.textContent=e.message}}

function openSettings(){if(!requireAdmin(openSettings,'Admin access is required to change settings.'))return;$('#modalBody').innerHTML=`<h2>Settings</h2><label class="small">Swimmer name</label><input id="sName" value="${esc(PROFILE.name)}"><label class="small">Team</label><input id="sTeam" value="${esc(PROFILE.team)}"><label class="small">Age</label><input id="sAge" type="number" min="1" max="99" value="${esc(PROFILE.age)}"><button class="goldBtn" style="width:100%;margin-top:12px" onclick="saveSettings()">Save Settings</button>`;showModal()}function saveSettings(){if(!requireAdmin(()=>openSettings(),'Admin access is required to save settings.'))return;PROFILE={name:$('#sName').value.trim()||'Evelyn Fisher',team:$('#sTeam').value.trim()||'',age:Number($('#sAge').value)||12};queueSync();renderProfile();closeModal()}function renderProfile(){let n=$('#heroName'),a=$('#heroAge'),h=$('#headProfile');if(n)n.textContent=PROFILE.name;if(a)a.textContent=PROFILE.age;if(h)h.textContent=`${PROFILE.name} · Age ${PROFILE.age}`}

function themeStorageKey(){return 'evieTheme:'+String(AUTH_SESSION?.user?.id||'device')}
function selectedTheme(){return localStorage.getItem(themeStorageKey())||'dark'}
function applyTheme(key){let t=THEMES[key]||THEMES.dark,r=document.documentElement;r.style.setProperty('--app-bg',t.bg);r.style.setProperty('--app-panel',t.panel);r.style.setProperty('--app-panel2',t.panel2);r.style.setProperty('--app-line',t.line);r.style.setProperty('--app-muted',t.muted);r.style.setProperty('--app-accent',t.accent);r.style.setProperty('--app-accent-text',t.accentText);r.style.setProperty('--app-header',t.hero[0]);r.style.setProperty('--app-nav',t.nav);r.style.setProperty('--app-input',t.input);r.style.setProperty('--app-input-line',t.inputLine);r.style.setProperty('--app-hero1',t.hero[0]);r.style.setProperty('--app-hero2',t.hero[1]);r.style.setProperty('--app-text',t.text);r.style.setProperty('--wave1',t.wave1);r.style.setProperty('--wave2',t.wave2);r.style.setProperty('--app-soft',t.panel2);r.style.setProperty('--bg',t.bg);r.style.setProperty('--p',t.panel);r.style.setProperty('--line',t.line);r.style.setProperty('--mut',t.muted);r.style.setProperty('--gold',t.accent);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',t.hero[0])}
function chooseTheme(key){if(!THEMES[key])return;localStorage.setItem(themeStorageKey(),key);applyTheme(key);openAppearance()}
function openAppearance(){let current=selectedTheme();$('#modalBody').innerHTML=`<h2>🎨 Personalize</h2><p class="small">Choose the look you want. This only changes the appearance on your account and does not change swim data.</p><div class="themeGrid">${Object.entries(THEMES).map(([k,t])=>`<button class="themeChoice ${k===current?'active':''}" onclick="chooseTheme('${k}')"><span class="themePreview"><i style="background:${t.hero[0]}"></i><i style="background:${t.accent}"></i><i style="background:${t.panel2}"></i></span><span class="themeName">${esc(t.name)} ${k===current?'<span class="themeCheck">✓</span>':''}</span></button>`).join('')}</div>`;showModal()}
let MODAL_RETURN=null;

function returnFromModal(fallback){let fn=MODAL_RETURN;MODAL_RETURN=null;if(fn){fn();return}if(typeof fallback==='function'){fallback();return}closeModal()}
function saveUser(){queueSync()}function showModal(){$('#modal').classList.add('on')}function closeModal(){MODAL_RETURN=null;$('#modal').classList.remove('on')}function renderAll(){dashboard();if($('#swimList')&&$('#q')&&$('#stroke')&&$('#sort'))times();if($('#progressEvent'))progress();renderTrophyRoom()}
