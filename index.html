<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0c11"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Evie Swim Tracker</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;--bg:#090b10;--p:#141821;--line:#2c313d;--mut:#9ca3af;--gold:#e5c84b;--blue:#7aa2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;padding-bottom:80px}header{position:sticky;top:0;z-index:3;background:#10131af5;border-bottom:1px solid var(--line);padding:15px 14px}h1{margin:0;font-size:22px}h2{margin:8px 0 12px}main{padding:13px;max-width:800px;margin:auto}input,select,textarea,button{font:inherit;color:#fff;background:#171b24;border:1px solid #363c49;border-radius:11px;padding:11px}input,textarea{width:100%}.row{display:flex;gap:7px;margin:8px 0}.row>*{flex:1;min-width:0}.page{display:none}.page.on{display:block}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.pb{border-color:var(--gold)}.top{display:flex;justify-content:space-between;gap:10px}.num{font-size:18px;font-weight:900}.name{font-weight:700}.meta,.small{font-size:11px;color:var(--mut)}.pill{font-size:10px;border:1px solid #4a5060;border-radius:99px;padding:4px 7px;height:max-content}.gold{color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{font-size:23px;display:block}.hero{padding:17px;background:linear-gradient(135deg,#151a24,#0e1118);border:1px solid #3a3420}.hero h2{margin:0 0 4px}.time{font-size:24px;font-weight:900;margin-top:8px}.drop{font-size:12px;color:var(--gold);font-weight:800}.actions{display:flex;gap:6px;margin-top:9px}.actions button{flex:1}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#10131af8;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:70px;padding-bottom:env(safe-area-inset-bottom)}nav button{border:0;background:transparent;border-radius:0;font-size:10px;color:#aaa;padding:6px 1px}nav button.on{color:var(--gold)}.ico{display:block;font-size:20px}.modal{display:none;position:fixed;z-index:10;inset:0;background:#000b;padding:18px;overflow:auto}.modal.on{display:block}.sheet{max-width:650px;margin:5vh auto;background:#11151d;border:1px solid var(--line);border-radius:17px;padding:15px}.x{float:right}.event-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.event-grid .card{margin:0}.chart{width:100%;height:220px;background:#0b1020;border-radius:10px;display:block}.split{display:flex;justify-content:space-between;border-bottom:1px solid #252b36;padding:8px 2px}.goalbar{height:10px;background:#0c0f15;border-radius:99px;overflow:hidden;margin-top:8px}.goalfill{height:100%;background:var(--gold)}
</style></head><body><header><h1>Evie Swim Tracker <span class="small">v1</span></h1><div class="small">Evelyn Fisher · PEAQ · Age 12</div></header><main>
<section id="dashboard" class="page on"><div class="card hero"><h2>🏊 Evelyn Fisher</h2><div class="small">PEAQ · Swim progress vault</div><div id="dashStats" class="stats" style="margin-top:12px"></div></div><h2>Personal Bests</h2><div id="bestGrid" class="event-grid"></div><h2>Recent Swims</h2><div id="recent"></div></section>
<section id="times" class="page"><h2>Swim Times</h2><input id="q" placeholder="Search 50 Free, backstroke, meet…"><div class="row"><select id="stroke"><option value="">All strokes</option><option>Freestyle</option><option>Backstroke</option><option>Butterfly</option><option>Individual Medley</option></select><select id="sort"><option value="date">Newest</option><option value="event">Event</option><option value="fast">Fastest</option></select></div><div id="count" class="small"></div><div id="swimList"></div></section>
<section id="meets" class="page"><h2>Meets</h2><div id="meetList"></div></section>
<section id="progress" class="page"><h2>Progress</h2><div class="card"><select id="progressEvent" style="width:100%"></select><canvas id="progressChart" class="chart"></canvas><div id="progressMsg" class="small" style="margin-top:8px"></div></div><div id="progressList"></div></section>
<section id="more" class="page"><h2>Goals & Tools</h2><div class="card"><b>Goals</b><div id="goals"></div><button onclick="addGoal()">+ Add / update goal</button></div><div class="card"><b>Add a swim</b><p class="small">Add future meet results directly from the app.</p><button onclick="openAdd()">+ Add swim</button></div><div class="card"><button onclick="exportData()">Export backup</button> <button onclick="document.querySelector('#importFile').click()">Import backup</button><input hidden id="importFile" type="file" accept=".json"></div></section>
</main><nav><button class="on" data-p="dashboard"><span class="ico">⌂</span>Home</button><button data-p="times"><span class="ico">≋</span>Times</button><button data-p="meets"><span class="ico">★</span>Meets</button><button data-p="progress"><span class="ico">↗</span>Progress</button><button data-p="more"><span class="ico">☰</span>More</button></nav><div id="modal" class="modal"><div class="sheet"><button class="x" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<script>
let BASE=[], EXTRA=JSON.parse(localStorage.getItem('evieSwims')||'[]'), GOALS=JSON.parse(localStorage.getItem('evieGoals')||'{}');const $=s=>document.querySelector(s);const all=()=>[...BASE,...EXTRA];
function fmt(sec){sec=Number(sec);if(sec>=60){let m=Math.floor(sec/60),s=(sec-m*60).toFixed(2).padStart(5,'0');return m+':'+s}return sec.toFixed(2)}
async function boot(){BASE=await fetch('swims.json',{cache:'no-store'}).then(r=>r.json());renderAll();}
function bests(){let m={};all().forEach(s=>{let k=s.event+'|'+s.course;if(!m[k]||s.seconds<m[k].seconds)m[k]=s});return Object.values(m).sort((a,b)=>a.distance-b.distance||a.event.localeCompare(b.event))}
function swimCard(s){let pb=bests().some(x=>x.id===s.id);return `<div class="card ${pb?'pb':''}" onclick="openSwim('${s.id}')"><div class="top"><div><div class="num">${s.event}</div><div class="name">${s.time||fmt(s.seconds)}</div><div class="meta">${s.meet} · ${s.date} · ${s.course}</div></div><span class="pill">${pb?'PB':s.stroke}</span></div>${s.drop?`<div class="drop">↓ ${s.drop.toFixed(2)} sec improvement</div>`:''}</div>`}
function dashboard(){let a=all().slice().sort((x,y)=>y.date.localeCompare(x.date)),b=bests();$('#dashStats').innerHTML=`<div class="stat"><span class="small">Swims</span><b>${a.length}</b></div><div class="stat"><span class="small">Events</span><b>${b.length}</b></div>`;$('#bestGrid').innerHTML=b.map(s=>`<div class="card pb" onclick="openSwim('${s.id}')"><div class="small">${s.event}</div><div class="time">${s.time||fmt(s.seconds)}</div><div class="small">${s.course}</div></div>`).join('');$('#recent').innerHTML=a.slice(0,4).map(swimCard).join('')}
function filtered(){let q=$('#q').value.toLowerCase(),st=$('#stroke').value,a=all().filter(s=>(!st||s.stroke===st)&&(!q||s.event.toLowerCase().includes(q)||s.stroke.toLowerCase().includes(q)||s.meet.toLowerCase().includes(q)));let sort=$('#sort').value;if(sort==='date')a.sort((x,y)=>y.date.localeCompare(x.date));if(sort==='event')a.sort((x,y)=>x.event.localeCompare(y.event)||y.date.localeCompare(x.date));if(sort==='fast')a.sort((x,y)=>x.seconds-y.seconds);return a}
function times(){let a=filtered();$('#count').textContent=a.length+' swims';$('#swimList').innerHTML=a.map(swimCard).join('')||'<p class="small">No swims found.</p>'}
function meets(){let groups={};all().forEach(s=>(groups[s.meet]??=[]).push(s));$('#meetList').innerHTML=Object.entries(groups).map(([m,a])=>`<div class="card"><div class="num">${m}</div><div class="meta">${[...new Set(a.map(x=>x.date))].sort().join(' – ')} · ${a.length} swims</div>${a.sort((x,y)=>x.distance-y.distance).map(x=>`<div class="split"><span>${x.event}</span><b>${x.time||fmt(x.seconds)}</b></div>`).join('')}</div>`).join('')}
function progress(){let ev=[...new Set(all().map(s=>s.event))].sort();let cur=$('#progressEvent').value;$('#progressEvent').innerHTML=ev.map(e=>`<option ${e===cur?'selected':''}>${e}</option>`).join('');drawProgress()}
function drawProgress(){let ev=$('#progressEvent').value,a=all().filter(s=>s.event===ev).sort((x,y)=>x.date.localeCompare(y.date)),cv=$('#progressChart'),ctx=cv.getContext('2d'),W=Math.max(280,cv.clientWidth),H=220,dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.strokeStyle='#26324d';for(let i=0;i<4;i++){let y=25+i*50;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(W-12,y);ctx.stroke()}if(a.length<2){ctx.fillStyle='#9ba8c7';ctx.font='13px system-ui';ctx.fillText('Add another swim to chart progress',Math.max(35,W/2-105),112);$('#progressMsg').textContent=a.length?'Current best: '+(a[0].time||fmt(a[0].seconds)):'No swims yet';$('#progressList').innerHTML=a.map(swimCard).join('');return}let vals=a.map(x=>x.seconds),mn=Math.min(...vals),mx=Math.max(...vals),sp=Math.max(.01,mx-mn),X=i=>45+(W-60)*i/(a.length-1),Y=v=>180-(mx-v)/sp*145;ctx.strokeStyle='#7aa2ff';ctx.lineWidth=2;ctx.beginPath();a.forEach((x,i)=>i?ctx.lineTo(X(i),Y(x.seconds)):ctx.moveTo(X(i),Y(x.seconds)));ctx.stroke();ctx.fillStyle='#dbe5ff';a.forEach((x,i)=>{ctx.beginPath();ctx.arc(X(i),Y(x.seconds),3,0,Math.PI*2);ctx.fill()});$('#progressMsg').textContent=`${a.length} swims · ${fmt(mx-mn)} sec range`;$('#progressList').innerHTML=a.slice().reverse().map(swimCard).join('')}
function openSwim(id){let s=all().find(x=>x.id===id);$('#modalBody').innerHTML=`<h2>${s.event}</h2><div class="time gold">${s.time||fmt(s.seconds)}</div><p>${s.meet}</p><div class="small">${s.date} · ${s.course} · ${s.stroke}</div>${s.drop?`<p class="drop">↓ ${s.drop.toFixed(2)} seconds</p>`:''}${s.splits?.length?`<h3>Splits</h3>${s.splits.map((x,i)=>`<div class="split"><span>Split ${i+1}</span><b>${x}</b></div>`).join('')}`:''}<h3>Event History</h3>${all().filter(x=>x.event===s.event).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="split"><span>${x.date}</span><b>${x.time||fmt(x.seconds)}</b></div>`).join('')}`;$('#modal').classList.add('on')}
function openAdd(){$('#modalBody').innerHTML=`<h2>Add Swim</h2><input id="aEvent" placeholder="Event (ex: 50 Free)"><div class="row"><select id="aStroke"><option>Freestyle</option><option>Backstroke</option><option>Butterfly</option><option>Breaststroke</option><option>Individual Medley</option></select><select id="aCourse"><option>SCY</option><option>LCM</option><option>SCM</option></select></div><input id="aTime" placeholder="Time (39.35 or 1:28.54)"><input id="aDate" type="date"><input id="aMeet" placeholder="Meet name"><input id="aSplits" placeholder="Splits optional: 45.29, 50.05"><button onclick="saveAdd()">Save swim</button>`;$('#modal').classList.add('on')}
function parseTime(t){let p=t.trim().split(':').map(Number);return p.length===2?p[0]*60+p[1]:p[0]}
function saveAdd(){let t=$('#aTime').value.trim(),sec=parseTime(t),event=$('#aEvent').value.trim();if(!event||!t||!$('#aDate').value||!$('#aMeet').value.trim()||!Number.isFinite(sec)){alert('Event, time, date and meet are required.');return}EXTRA.push({id:'user-'+Date.now(),event,stroke:$('#aStroke').value,distance:Number(event.match(/\d+/)?.[0]||0),time:t,seconds:sec,date:$('#aDate').value,meet:$('#aMeet').value.trim(),course:$('#aCourse').value,splits:$('#aSplits').value.split(',').map(x=>x.trim()).filter(Boolean)});localStorage.setItem('evieSwims',JSON.stringify(EXTRA));closeModal();renderAll()}
function goals(){let b=bests();$('#goals').innerHTML=b.map(s=>{let g=GOALS[s.event],pct=g?Math.max(0,Math.min(100,(g/s.seconds)*100)):0;return `<div style="margin:12px 0"><div class="top"><span>${s.event}</span><b>${g?fmt(g):'No goal'}</b></div>${g?`<div class="goalbar"><div class="goalfill" style="width:${pct}%"></div></div><div class="small">PB ${fmt(s.seconds)}</div>`:''}</div>`}).join('')}
function addGoal(){let e=prompt('Event name (example: 50 Free)');if(!e)return;let t=prompt('Goal time (example: 38.00 or 1:25.00)');if(!t)return;let s=parseTime(t);if(!Number.isFinite(s))return;GOALS[e]=s;localStorage.setItem('evieGoals',JSON.stringify(GOALS));goals()}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),swims:EXTRA,goals:GOALS},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='evie-swim-tracker-backup.json';a.click();URL.revokeObjectURL(u)}
$('#importFile').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);EXTRA=j.swims||[];GOALS=j.goals||{};localStorage.setItem('evieSwims',JSON.stringify(EXTRA));localStorage.setItem('evieGoals',JSON.stringify(GOALS));renderAll();alert('Backup imported')}catch{alert('Could not read backup')}};r.readAsText(e.target.files[0])};function closeModal(){$('#modal').classList.remove('on')}function renderAll(){dashboard();times();meets();progress();goals()}['q','stroke','sort'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',times));$('#progressEvent').addEventListener('change',drawProgress);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on');if(b.dataset.p==='progress')progress()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');boot();
</script></body></html>
