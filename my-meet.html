<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e28"><title>Evie's Meet Day</title><style>
:root{font-family:Inter,ui-rounded,system-ui,sans-serif;color:#f8fbff;background:#080e28}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 80% 4%,#46379c 0,transparent 34%),radial-gradient(circle at 0 48%,#124a83 0,transparent 38%),#080e28}main{max-width:760px;margin:auto;padding:24px 18px 110px}.eyebrow{color:#83e4f9;letter-spacing:.18em;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero{position:relative;overflow:hidden;border:1px solid #ffffff28;border-radius:32px;padding:27px;background:linear-gradient(145deg,#30257c,#112c65 65%,#0a4763);box-shadow:0 22px 60px #0006}.hero:after{content:'✦';position:absolute;right:15px;top:-17px;font-size:115px;color:#ffffff14}h1{font-size:clamp(2.4rem,10vw,4.5rem);line-height:.98;margin:12px 0;font-weight:950;letter-spacing:-.05em}.subtitle{color:#c8d9ff;font-size:1rem}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.chip{border:1px solid #ffffff35;border-radius:999px;background:#ffffff19;padding:8px 12px;font-size:.78rem;font-weight:750}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{color:#d5edff;text-decoration:none;font-weight:800;font-size:.82rem}.refresh{border:0;border-radius:999px;background:#ffffff19;color:white;padding:9px 13px;font-weight:800}.section{display:flex;align-items:end;justify-content:space-between;margin:29px 2px 13px}.section h2{margin:0;font-size:1.38rem;letter-spacing:-.02em}.section span{color:#a6bdd5;font-size:.76rem}.race{border-radius:25px;margin:12px 0;padding:19px 20px;border:1px solid #ffffff1f;background:linear-gradient(135deg,#142642,#131a39);box-shadow:0 10px 30px #0003}.race.done{background:linear-gradient(135deg,#16436b,#2d3178 85%);border-color:#67dff86b}.raceTop{display:flex;justify-content:space-between;gap:12px;align-items:start}.race h3{margin:0;font-size:1.45rem}.badge{background:#ffffff20;border:1px solid #ffffff25;border-radius:999px;padding:6px 10px;font-size:.68rem;font-weight:850;white-space:nowrap}.badge.done{background:#6cf0db;color:#07343c;border:0}.time{font-size:3.3rem;font-weight:950;letter-spacing:-.06em;line-height:1.05;margin:17px 0 6px}.note{color:#c5d8ec;font-size:.88rem}.next{color:#95ecfc;font-weight:850;margin-top:13px}.cheer{border-radius:20px;margin:10px 0;padding:16px 18px;background:#ffffff10;border:1px solid #ffffff16}.cheer b{color:#a8ecff}.cheer p{margin:8px 0 0;line-height:1.4}.empty{color:#b4c9e0;background:#ffffff0b;border:1px dashed #ffffff33;border-radius:20px;padding:23px;text-align:center}.footer{position:fixed;bottom:0;left:0;right:0;padding:10px max(18px,calc((100vw - 724px)/2));background:#0b1431ee;backdrop-filter:blur(14px);border-top:1px solid #ffffff1d;display:flex;gap:10px}.footer button{width:100%;padding:14px;border:0;border-radius:16px;background:#53d8f4;color:#062640;font-size:.95rem;font-weight:900}.footer button.secondary{background:#ffffff19;color:white}#status{color:#c1d3e9;font-size:.76rem;text-align:center;margin-top:20px}@media(prefers-reduced-motion:no-preference){.race{animation:rise .35s both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body><main><div class="top"><a class="back" href="./">← Swim Tracker</a><button class="refresh" onclick="load()">↻ Refresh</button></div><div class="hero"><div class="eyebrow">Meet day • Evie's lane</div><h1>Ready to<br>make waves?</h1><div class="subtitle" id="meetName">Loading today's meet…</div><div class="chips" id="meetInfo"></div></div><div class="section"><h2>My races</h2><span id="raceCount"></span></div><div id="races" class="empty">Getting the lineup…</div><div class="section"><h2>💜 Cheer Squad</h2><span>They're rooting for you</span></div><div id="cheers" class="empty">Checking messages…</div><div id="status"></div></main><div class="footer"><button onclick="load()">See my latest time ↗</button><button class="secondary" onclick="document.getElementById('cheers').scrollIntoView({behavior:'smooth'})">💜 Cheers</button></div><script>
const root='https://mgatwzmnwupvcntbcehd.supabase.co',key='sb_publishable_f9VBvG6tj3o_YHMOML9bCA_FvTKZ3d4';let selected=null;
async function rows(path){let r=await fetch(root+'/rest/v1/'+path,{headers:{apikey:key,Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error('Could not load meet data ('+r.status+')');return r.json()}
const el=(tag,cls,text)=>{let x=document.createElement(tag);if(cls)x.className=cls;if(text!=null)x.textContent=text;return x};
function renderMeet(m){document.getElementById('meetName').textContent=m.name||'Meet day';let info=document.getElementById('meetInfo');info.replaceChildren();[m.date,m.course,m.place].filter(Boolean).forEach(t=>info.append(el('span','chip',t)));let list=document.getElementById('races');list.replaceChildren();let events=m.events||[],results=m.draftResults||[];document.getElementById('raceCount').textContent=events.length+' event'+(events.length===1?'':'s');if(!events.length){list.append(el('div','empty','Your races will show here once they are added.'));return}events.forEach((name,i)=>{let result=results.find(x=>x.event===name),card=el('article','race'+(result?' done':'')),top=el('div','raceTop');top.append(el('h3','',name),el('span','badge'+(result?' done':''),result?'FINISHED':'UP NEXT'));card.append(top);if(result){card.append(el('div','time',result.time||format(result.seconds)));card.append(el('div','note',result.official===false?'Unofficial time':'Your time is in!'));card.append(el('div','next','You showed up and gave it your all ✨'))}else card.append(el('div','next',i===0?'Your next splash starts here 🌊':'Your race is waiting for you'));list.append(card)})}
function format(n){n=Number(n);if(!Number.isFinite(n))return '—';return n<60?n.toFixed(2):Math.floor(n/60)+':'+(n%60).toFixed(2).padStart(5,'0')}
function renderCheers(messages){let area=document.getElementById('cheers');area.replaceChildren();if(!messages.length){area.className='empty';area.textContent='Your cheering section is ready. Messages will appear here!';return}area.className='';messages.slice().reverse().forEach(c=>{let card=el('div','cheer');card.append(el('b','',c.sender_name==='Evie'?'Evie replied':c.sender_name),el('p','',c.message));area.append(card)})}
async function load(){let status=document.getElementById('status');status.textContent='Checking for updates…';try{let id=new URLSearchParams(location.search).get('meet'),list=await rows('swim_meets?select=id,meet_data,updated_at&order=updated_at.desc&limit=30');let row=id?list.find(x=>x.id===id):list.find(x=>!x.meet_data?.finished)||list[0];if(!row)throw Error('No meet is available yet.');selected=row.id;renderMeet(row.meet_data||{});let messages=await rows('cheer_messages?meet_id=eq.'+encodeURIComponent(row.id)+'&select=sender_name,message,created_at&order=created_at.asc');renderCheers(messages);status.textContent='Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}catch(e){status.textContent=e.message;document.getElementById('races').textContent='Could not load the meet. Tap Refresh to try again.'}}
load();setInterval(()=>{if(!document.hidden)load()},15000);
</script></body></html>
